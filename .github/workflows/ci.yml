# FILE-007: CI for the Bank Nifty Deep Data Forensics Lab (FR-12, FR-13, NFR-03, NFR-05, NFR-07, NFR-08).
# Runs lint, the Omega-3 p-value peeking ban, the F1.2 Skeptic/twin isolation check, a token-like
# string scan, the full pytest suite and `bnf selftest` (twice, SHA-256 compared) on CPython 3.11-3.14.
# The artifact version lives in env.SCHEMA_VERSION: GitHub rejects unknown top-level workflow keys.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEMA_VERSION: "1.0"
  PYTHONHASHSEED: "0"
  BNF_SEED: "42"
  BNF_RUN_ENV: "ci"
  UPSTOX_RO_TOKEN: ""

jobs:
  test:
    name: py${{ matrix.python }} ${{ matrix.extras }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
        extras: ["dev,models"]
        include:
          - python: "3.13"
            extras: "dev"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install (clean venv, bounded pins)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Token/secret env names present (bnf unsets them at start, NFR-05)
        run: |
          env | cut -d= -f1 | grep -Ei 'TOKEN|SECRET' || echo "none"
      - name: Lint
        run: |
          . .venv/bin/activate
          make lint
      - name: Omega-3 p-value peeking ban (F33)
        run: |
          . .venv/bin/activate
          if grep -nE "pvalue|p_value|p_val|ttest|sign_flip|norm\.sf|\.sf\(" src/bn_forensics/ledger.py; then
            echo "p-value code found in ledger.py"; exit 1
          fi
          python -m pytest -q tests/test_ledger_evalue.py -k static_ban
      - name: F1.2 / F5 isolation of skeptic_checks.py and twin_impl.py
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import ast, pathlib, subprocess, sys
          for name in ("skeptic_checks.py", "twin_impl.py", "__init__.py"):
              tree = ast.parse(pathlib.Path("src/bn_forensics", name).read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  mods = [a.name for a in node.names] if isinstance(node, ast.Import) else (
                      [("." * node.level) + (node.module or "")] if isinstance(node, ast.ImportFrom) else [])
                  for m in mods:
                      if m.startswith((".", "bn_forensics", "pandas")) or "core_stats" in m or "quartermaster" in m:
                          sys.exit(f"{name} imports {m} (F1.2)")
          for mod in ("bn_forensics.skeptic_checks", "bn_forensics.twin_impl"):
              out = subprocess.run([sys.executable, "-c", f"import sys, {mod}; print(sorted(m for m in sys.modules if m.startswith('bn_forensics')))"],
                                   capture_output=True, text=True, check=True).stdout.strip()
              if out != str(sorted(["bn_forensics", mod])):
                  sys.exit(f"{mod} pulled in {out}")
          print("isolation OK")
          PY
      - name: Token-like string scan of tracked files (X31)
        run: |
          . .venv/bin/activate
          git ls-files -z | xargs -0 python -c "import sys, bn_forensics as b; hits=[(p, b.find_token_like(open(p, encoding='utf-8', errors='ignore').read())) for p in sys.argv[1:]]; bad=[h for h in hits if h[1]]; print(bad); sys.exit(1 if bad else 0)"
      - name: pytest (offline; socket guard in conftest)
        run: |
          . .venv/bin/activate
          python -m pytest -q
      - name: bnf usage errors exit 3
        run: |
          . .venv/bin/activate
          set +e
          bnf --no-such-flag; code=$?
          set -e
          test "$code" -eq 3
      - name: bnf selftest twice, CSV SHA-256 must match (NFR-03)
        run: |
          . .venv/bin/activate
          bnf selftest --run-dir runs/ci_a | tee a.txt
          bnf selftest --run-dir runs/ci_b | tee b.txt
          test "$(grep SELFTEST_CSV_SHA256 a.txt)" = "$(grep SELFTEST_CSV_SHA256 b.txt)"
