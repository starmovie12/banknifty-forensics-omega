# FILE-012 · config/default_config.yaml · frozen system defaults (PRD 3.0.0)
# Every value here is a declared default; PRD source in the trailing comment.
# Market facts (session times, bar counts, lot sizes, expiry weekdays) are NOT here:
# they come from data and config/era_calendar.yaml (NG-9, R29).
schema_version: "1.0"
config_id: "bnf-default-v3.0.0"
seed: 42                                  # NFR-03

profiles:                                 # §7.7 profiles
  full: {workers: 4, bootstrap_B: 5000, sklearn: optional}
  lite: {workers: 2, bootstrap_B: 2000, sklearn: disabled}   # Court B_court is never reduced (§10.4 #7)

store:                                    # §10.1
  primary_underlying: "BANKNIFTY"
  mandatory_table: "spot_1m"              # Q2
  base_tables: [spot_1m, fut_1m, opt_1m, opt_wide_1m, spot_1d, vix_1m, vix_1d, stock_1m, global_1m]
  derived_tables: [bars_3m, bars_15m, chain_1m, chain_metrics_1m, iv_greeks_1m, iv_daily_DERIVED, daily_metrics_DERIVED]
  usable_session_type: "NORMAL"           # Q6
  required_utc_offset_minutes: 330        # Q6: +05:30 contract offset
  usable_iv_status: "OK"                  # Q8

analysis:
  source_table: "spot_1m"                 # the Lab rebuilds bars from spot_1m (§10.1)
  bar_minutes: 3                          # T-16 3-min analysis frame
  rebuild_tables: {bars_3m: 3, bars_15m: 15}

quarantine:                               # §10.1b
  sample_first_days: 3                    # CP0 2-3 day probe
  ts_probe_sessions: 3                    # Q7
  mad_k: 8.0                              # Q9 Tier-2 spike flag
  retrace_frac: 0.80                      # Q9 flag-only retrace
  reconcile_tolerance: 0.0                # Q12 silent merge blocked on diff > 0
  derived_recipe_required: true           # Q11 UNVERIFIED-CAUSAL when missing

split:                                    # FR-04, §10.4 #10, D-11
  playground_frac: 0.60
  warmup_days: 20
  embargo_long: 5
  embargo_short: 1
  daily_close_min_trading_days: 145
  disable_daily_close: "NO"
  mode: "era_b_court"                     # D-11 default
  day_limited_floor: 120
  power_limit_days: 625
  n_min_fresh_days: 60                    # N_min (X09, DEF-11)

stats:                                    # FR-06, R5, R14
  bootstrap_B: 5000
  bootstrap_B_lite: 2000
  permutation_B: 5000
  ci_level: 0.95
  n_blocks: 4                             # stability blocks (X28)
  min_block_event_days: 10
  effective_n_min: 30                     # R4 ANECDOTAL floor
  horizon_cap_frac: 0.25                  # h <= bars_per_day / 4 (R24, F7)
  default_horizons: [1, 3, 5, 10, 20]
  atr_window: 20                          # §10.4 #1
  q_disc: 0.05
  power: 0.80
  nominal_mde_factor: 2.8                 # §10.4 #3
  outlier_day_frac: 0.01                  # R20
  placebo_shift_min: 30                   # Skeptic #1
  vol_terciles: 3

targets:
  mde_target_atr20: 0.25                  # D-2 / A-4
  T7_enabled: false                       # D-6 / CF-12
  expansion_x: [0.5, 1.0, 1.5, 2.0, 3.0]  # T4
  excursion_quantiles: [0.50, 0.75, 0.90, 0.95]

court:                                    # FR-11, §10.4 #2 #7 #9
  K_default: 20
  K_max: 50
  jaccard_max: 0.50
  event_days_min: 30
  alpha_total: 0.05
  B_court_min: 10000
  B_court_factor: 10
  seed_offset_base: 42                    # seed = 42 + k
  power_precheck:
    median_event_days_min: 30
    court_mde_ceiling_sd: 0.60            # PR-16
  lane_m_reserve: 5                       # PR-08
  exposure_majority: 0.50                 # R28: EXPOSED-COURT when > 50%
  chunk_rows: 10000

ledger:                                   # FR-13, §10.4 #4
  M: 20000
  alpha: 0.05
  alpha_halved: 0.025                     # §10.4 #12 union FPR rule
  c: 1.10
  rho_grid: [0.15, 0.30, 0.60]
  tick_days: 10
  register_top: 50                        # PR-17
  sd_degenerate: 1.0e-12
  decay_windows: 2                        # FM-24

playground:                               # FR-09, §9.5
  max_ideas: 20000                        # D-8
  max_wall_min: 240                       # D-8 / NFR-11
  dsl_max_bricks: 3                       # PR-14
  merge_jaccard: 0.80                     # duplicate merge (S2 Pillar 8)
  persona_jaccard_max: 0.30               # PR-11
  saturation:                             # PR-09
    consecutive_batches: 3
    det_batch_min: 300
    ai_batch_min: 50
    cluster_jaccard: 0.80
    top_n: 50
  deterministic_modes: [H2, H3, H4, H5, H9, H10, H11, H12]
  ai_modes: [H1, H6, H7, H8, H13]
  personas: [Microstructure, Options-Greeks, Behavioural-Flow, Statistician-Skeptic, Contrarian]
  persona_min_cards: 8
  mutation_grid: [0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 3.0]
  quantile_ladder: [q10, q25, q75, q90, q95, q99]
  cusum_k_sd: 0.5
  cusum_h_sd: 4.0

shrinkage:                                # FR-10, §10.4 #8
  min_cards: 50
  t1_cost_multiple: 2.0                   # T1 only if |deflated_lift| >= 2x cost
  t2_cost_multiple: 1.0                   # T2 if 1x <= ratio < 2x; T3 below 1x
  ns_jaccard: 0.50                        # §10.4 #5
  orthogonal_jaccard: 0.50
  orthogonal_corr: 0.50

null_lab:                                 # FR-05, Ω-1..Ω-3, Ω-9
  worlds: 300
  K_search: 200
  parents: 50
  mutants_per_parent: 3
  mutant_overlap: 0.85
  deltas: [0.1, 0.2, 0.3, 0.5, 0.8]
  recall_worlds: 200
  twin_events: 200
  twin_tol_abs: 1.0e-6
  twin_tol_rel: 0.001
  fpr_max: 0.05
  calibration_divergence: 0.25
  ledger_forward_days: 250
  ledger_cards_per_world: 20
  peeking_alpha: 0.05
  peeking_c: 1.00
  uncapped_rounds: 24

mechanism:                                # FR-10 Lane M
  dose_bins: 3
  control_max_ratio: 0.50                 # control lift must stay below 50% of the treated lift

cost_model:                               # §10.4 #11 (D-1 default, verified Upstox charges 2026-11-20)
  currency: "INR"
  rounding: "per_leg_total_paise"         # each leg total rounded to paise
  brokerage_per_order: "30"
  exchange_pct: "0.035"                   # in GST base
  sebi_pct: "0.0001"                      # in GST base
  ipft_pct: "0.0005"                      # not in GST base
  gst_pct: "18"
  stamp_buy_pct: "0.003"
  stt_sell_pct_schedule:
    - {from: "2026-04-01", pct: "0.15"}
    - {from: "1900-01-01", pct: "0.10"}
  half_spread_estimate: "1.00"            # ESTIMATE until Recorder days measure it
  slippage: "0.20"
  delta_default: "0.5"
  default_cost_series: {T1: option_buyer, T6: option, T8: option_buyer}
  reference_premiums: ["200", "400", "800"]
  reference_lots: [1, 3]
  underlying_cost_pts: null               # USER TO CONFIRM; null -> option_buyer model or T?

budget:                                   # NFR-11, D-8
  max_wall_min: 240
  max_ideas: 20000
  token_cap: null
  usd_cap: null

exposure:
  policy: "cap"                           # D-12: cap | exclude | ignore

report:                                   # FR-17, §10.5
  max_tokens: 60000
  owner_brief_max_lines: 40
  ai_handoff_max_lines: 200
  hinglish_max_lines: 30
  verdict_block_max_lines: 8
  digest_max_lines: 8
  graveyard_closest: 50
  chat_summary_max_lines: 16
  top_inline_findings: 50
  registry_columns: 37
  event_ledger_columns: 12

verify:                                   # FR-16
  sample_rows: 10
  rel_tol: 0.01
  max_fix_rounds: 2
  val_top: 3

models:                                   # H7 / Phase 7.4 (scikit-learn optional)
  families: [logistic, ridge, gbdt]
  folds: 3
  min_train_frac: 0.50
  top_frac: 0.10
  logistic_C: 1.0
  ridge_alpha: 1.0
  gbdt: {max_depth: 2, n_estimators: 100, learning_rate: 0.1}

nfr:
  rss_max_mb: 4096                        # NFR-02 (PR-04)
  rss_max_mb_lite: 1024
  event_ledger_gzip_mb: 25
  perf_budget_ms: 180000                  # NFR-01 (PR-04)

security:                                 # NFR-05
  scrub_env_names: ["UPSTOX_RO_TOKEN"]
  scrub_env_substrings: ["TOKEN", "SECRET"]
  token_paths: ["~/.config/bnbot/token"]
  run_id_pattern: "^(latest|[A-Za-z0-9_-]{1,64})$"
