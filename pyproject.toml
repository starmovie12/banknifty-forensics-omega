# banknifty-forensics-omega | FILE-004 | PRD 3.0.0 (§7.7 pins, PR-02)

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "banknifty-forensics-omega"
version = "1.0.0"
description = "Diagnosis-only Bank Nifty deep data forensics lab (V5 + Omega Never-Stop Engine)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX",
    "Private :: Do Not Upload",
]
dependencies = [
    "jsonschema>=4.21,<5.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "pyarrow>=14.0,<28.0",
    "pyyaml>=6.0,<7.0",
    "scipy>=1.12,<2.0",
]

[project.optional-dependencies]
# scikit-learn is optional (§7.7, X34): absent -> MODEL cards and Phase 6.3 report NOT-RUN(ENV).
models = [
    "scikit-learn>=1.4,<2.0",
]
# psutil: NFR-02 RSS check (DEF-01, missing from the §7.7 table).
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.4,<1.0",
    "psutil>=5.9,<8.0",
]

[project.scripts]
bnf = "bn_forensics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bn_forensics"]

# Non-editable installs ship the declarative libraries, schemas, prompts and the selftest fixture
# inside the package; editable installs read them from the repository root.
[tool.hatch.build.targets.wheel.force-include]
"config" = "bn_forensics/_assets/config"
"schemas" = "bn_forensics/_assets/schemas"
"prompts" = "bn_forensics/_assets/prompts"
"tests/fixtures/sample_spot_3d.csv" = "bn_forensics/_assets/fixtures/sample_spot_3d.csv"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/bn_forensics",
    "/config",
    "/schemas",
    "/prompts",
    "/tests",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short"]
xfail_strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# S: NFR-05 bans eval/exec and unsafe YAML; NPY: seed=42 Generator API only (NFR-03).
select = ["B", "C4", "E", "F", "I", "NPY", "PT", "RUF", "S", "SIM", "UP", "W"]
ignore = [
    "E501",    # long literal strings (formulas, report text)
    "RUF001",  # PRD labels use non-ASCII (Ω-A, em dash in "N/A — DATA MISSING")
    "RUF002",
    "RUF003",
    "SIM108",  # explicit if/else kept for statistical readability
]

[tool.ruff.lint.per-file-ignores]
# FILE-024 runs FILE-034/FILE-037 as isolated `python3 -m` subprocesses (§8.1 Ω-S6).
"src/bn_forensics/cli.py" = ["S603"]
"tests/**" = ["S101", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["bn_forensics"]
